<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1{
            /*color: rgba(255,0,0,5);*/
            /*HSL-Hue Saturation Lightness*/
            color:hsl(344°, 82%, 56%);
        }
        p{
            /*Units: px,%,    */
            font-size: 40px;
            /* % percentage 
            relative to the parent*/
        }
        .parent{
            width: 400px;
        }
        .child{
            width:50%
        }
        /*em --> realtive to parent size*/
        .parent{
            font-size: 20px;
        }
        .child{
            font-size: 2em;
            /*  2*parent size(20)=40px */
        }
        /* rem -->Relative to root element */
        html{
            font-size: 16px;
        }
        h1{
            font-size: 2rem;
            /*  2*html(rem)=32px */
        }
        /* vh --> Viewport Height */
        .hero{
            height:100vh;
            /*  100 per screen height */
        }
        /* vw --> Viewpoint width */
        .banner{
            width:100vw;
        }
    </style>
</head>
<body>
    <h1>Welcome to Chalapathi</h1>
    <p>Come Regularly</p>
    <div class="parent">
        <div class="Child"></div>
    </div>
</body>
</html>
