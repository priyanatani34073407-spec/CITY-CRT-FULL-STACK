<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Account</title>
</head>
<body>
    <center>
        <h1>facebook</h1>
        <h2>Find Your Account</h2>
        <p>
            Please enter your mobile number or email address to search for your account.
        </p>
        <form>
            <label for="account">
                Mobile Number or Email Address
            </label>
            <br><br>
            <input
                type="text"
                id="account"
                placeholder="Enter mobile number or email"
                required>
            <br><br>
            <input type="submit" value="Search">
        </form>
        <br>
        <a href="facebooklogin.html">Back to Login</a>
    </center>
</body>
</html>
